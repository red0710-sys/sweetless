<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d10"><title>SweetLess</title><style>
:root{color-scheme:dark;--bg:#0b0d10;--card:#15191e;--line:#2a3038;--text:#f5f7fa;--muted:#9ba4af;--accent:#ff7a45;--good:#66d19e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}.wrap{max-width:560px;margin:auto;padding:22px 16px 80px}.brand{display:flex;justify-content:space-between;align-items:center}.brand h1{font-size:25px;margin:0}.brand small,.sub,.note{color:var(--muted)}.hero{margin-top:20px;background:linear-gradient(145deg,#181d23,#111419);border:1px solid var(--line);border-radius:24px;padding:22px}.score{font-size:58px;font-weight:800;letter-spacing:-3px}.score span{font-size:15px;color:var(--muted);letter-spacing:0}.msg{color:var(--good);margin-top:4px}.meter{margin-top:16px}.meterTop{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:7px}.track{height:9px;background:#252b32;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:var(--good);border-radius:99px;transition:.3s}.warn{color:#ffb25b}.danger{color:#ff6b6b}.guilt{margin-top:10px;font-size:13px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:18px}.stat{padding:14px}.stat b{font-size:21px}.stat small{display:block;color:var(--muted);margin-top:5px}.add{width:100%;margin:16px 0;border:0;border-radius:18px;padding:17px;background:var(--accent);font-size:17px;font-weight:800;color:#111}.card{padding:18px;margin-top:12px}.card h2{font-size:17px;margin:0 0 14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,select{width:100%;background:#0f1216;color:var(--text);border:1px solid var(--line);border-radius:13px;padding:13px;font-size:16px;margin-bottom:10px}.save{width:100%;padding:14px;border:0;border-radius:13px;background:var(--text);color:#111;font-weight:800}.tabs{display:flex;gap:7px;margin-bottom:12px}.tabs button{background:#0f1216;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:7px 12px}.tabs .on{color:#111;background:var(--text)}canvas{width:100%;height:130px}.item{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.sub{font-size:13px}.actions{display:flex;gap:4px;align-items:center}.edit,.del{border:0;background:none;font-size:14px;padding:8px}.edit{color:#9fc8ff}.del{color:#e78888}.note{font-size:12px;line-height:1.6;margin-top:18px}#form{display:none}.empty{color:var(--muted);font-size:14px}</style></head><body><main class="wrap">
<div class="brand"><div><h1>SweetLess ♥</h1><small>喝得開心，也喝得有數。</small></div><small>LOCAL</small></div>
<section class="hero"><div class="sub">DRINK SCORE</div><div class="score" id="score">100 <span>/ 100</span></div><div class="msg" id="msg">今天還沒有手搖飲紀錄。</div><div class="meter"><div class="meterTop"><span>本週額度</span><span id="quotaText">0 / 2 杯</span></div><div class="track"><div class="fill" id="quotaFill"></div></div><div class="guilt" id="guilt">目標：一週最多 2 杯。</div></div></section>
<div class="grid"><div class="stat"><b id="week">0</b><small>本週杯數</small></div><div class="stat"><b id="sugar">0g</b><small>估算糖量</small></div><div class="stat"><b id="zero">—</b><small>無糖率</small></div></div>
<button class="add" onclick="toggleForm()">＋ 今天喝一杯</button>
<section class="card" id="form"><h2 id="formTitle">新增飲料</h2><input type="datetime-local" id="dateInput"><input id="brandInput" placeholder="品牌（例：五十嵐）"><input id="drinkInput" placeholder="品項（例：四季春）"><div class="row"><select id="sizeInput"><option value="500">中杯 500ml</option><option value="700" selected>大杯 700ml</option></select><select id="sweetInput"><option value="0">無糖</option><option value=".1">一分糖</option><option value=".3" selected>微糖 / 三分</option><option value=".5">半糖</option><option value=".7">少糖 / 七分</option><option value="1">全糖</option></select></div><select id="iceInput"><option>正常冰</option><option>少冰</option><option selected>微冰</option><option>去冰</option><option>熱</option></select><button class="save" id="saveBtn" onclick="saveDrink()">儲存這一杯</button><button id="cancelBtn" onclick="cancelEdit()" style="display:none;width:100%;margin-top:8px;padding:12px;border:1px solid var(--line);border-radius:13px;background:transparent;color:var(--muted)">取消編輯</button></section>
<section class="card"><h2>最近 7 天</h2><canvas id="chart"></canvas><div class="sub">每日杯數 · 紀錄越久，趨勢越有意義</div></section><section class="card"><h2>最近紀錄</h2><div id="history" class="empty">還沒有紀錄。</div></section>
<p class="note">糖量為估算值，不同品牌、配方與配料可能有明顯差異。本工具用於生活紀錄與習慣觀察，不作為醫療或營養診斷。資料僅儲存在目前瀏覽器裝置。</p></main><script>
const KEY='sweetless.v1';let data=JSON.parse(localStorage.getItem(KEY)||'[]'),editingId=null;const $=id=>document.getElementById(id);function localDT(d=new Date()){let z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,16)};$('dateInput').value=localDT();
function toggleForm(){let f=$('form');f.style.display=f.style.display==='block'?'none':'block'}
function sugarEstimate(size,sweet){return Math.round((size/700)*70*sweet)}
function saveDrink(){let e={id:editingId||Date.now(),date:new Date($('dateInput').value||Date.now()).toISOString(),brand:$('brandInput').value.trim()||'手搖飲',drink:$('drinkInput').value.trim()||'飲料',size:+$('sizeInput').value,sweet:+$('sweetInput').value,ice:$('iceInput').value};e.sugar=sugarEstimate(e.size,e.sweet);if(editingId){let i=data.findIndex(x=>x.id===editingId);if(i>=0)data[i]=e}else data.unshift(e);data.sort((a,b)=>new Date(b.date)-new Date(a.date));localStorage.setItem(KEY,JSON.stringify(data));resetForm();$('form').style.display='none';render()}function editDrink(id){let e=data.find(x=>x.id===id);if(!e)return;editingId=id;$('dateInput').value=localDT(new Date(e.date));$('brandInput').value=e.brand;$('drinkInput').value=e.drink;$('sizeInput').value=String(e.size);$('sweetInput').value=String(e.sweet);$('iceInput').value=e.ice;$('formTitle').textContent='編輯這杯';$('saveBtn').textContent='儲存修改';$('cancelBtn').style.display='block';$('form').style.display='block';$('form').scrollIntoView({behavior:'smooth',block:'start'})}function resetForm(){editingId=null;$('dateInput').value=localDT();$('brandInput').value='';$('drinkInput').value='';$('formTitle').textContent='新增飲料';$('saveBtn').textContent='儲存這一杯';$('cancelBtn').style.display='none'}function cancelEdit(){resetForm();$('form').style.display='none'}
function removeDrink(id){data=data.filter(x=>x.id!==id);localStorage.setItem(KEY,JSON.stringify(data));render()}
function since(days){let t=Date.now()-days*864e5;return data.filter(x=>new Date(x.date).getTime()>=t)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){let w=since(7),sg=w.reduce((a,x)=>a+x.sugar,0),zr=w.length?Math.round(w.filter(x=>x.sweet===0).length/w.length*100):null;$('week').textContent=w.length;$('sugar').textContent=sg+'g';$('zero').textContent=zr===null?'—':zr+'%';let over=Math.max(0,w.length-2),sc=Math.max(0,100-w.length*8-over*18-Math.round(sg/18));$('score').innerHTML=sc+' <span>/ 100</span>';$('quotaText').textContent=w.length+' / 2 杯';$('quotaFill').style.width=Math.min(100,w.length/2*100)+'%';$('quotaFill').style.background=w.length<=1?'#66d19e':w.length===2?'#ffb25b':'#ff6b6b';let guilt=w.length===0?'本週額度還完整：2 杯。':w.length===1?'已用掉 50% 額度，還有 1 杯。':w.length===2?'本週額度已用完。下一杯就是超標。':'本週已超標 '+over+' 杯。這杯真的有必要嗎？';$('guilt').textContent=guilt;$('guilt').className='guilt '+(w.length===2?'warn':w.length>2?'danger':'');$('msg').textContent=w.length===0?'漂亮，先把額度留給真正想喝的時候。':w.length===1?'第一杯沒問題；第二杯要挑值得的。':w.length===2?'2 杯達標。這週可以收工了。':'已超過你設定的一週 1–2 杯。';$('history').innerHTML=data.length?data.slice(0,12).map(x=>'<div class="item"><div><b>'+esc(x.brand)+' · '+esc(x.drink)+'</b><div class="sub">'+new Date(x.date).toLocaleDateString('zh-TW')+' · '+x.size+'ml · 約 '+x.sugar+'g 糖 · '+esc(x.ice)+'</div></div><div class="actions"><button class="edit" onclick="editDrink('+x.id+')">編輯</button><button class="del" onclick="removeDrink('+x.id+')">刪除</button></div></div>').join(''):'<div class="empty">還沒有紀錄。第一杯從今天開始。</div>';draw()}
function draw(){let c=$('chart'),ctx=c.getContext('2d'),dpr=devicePixelRatio||1,W=c.clientWidth,H=130;c.width=W*dpr;c.height=H*dpr;ctx.scale(dpr,dpr);let vals=[];for(let i=6;i>=0;i--){let dt=new Date();dt.setHours(0,0,0,0);dt.setDate(dt.getDate()-i);vals.push(data.filter(x=>{let q=new Date(x.date);q.setHours(0,0,0,0);return q.getTime()===dt.getTime()}).length)}let max=Math.max(1,...vals),gap=W/7;ctx.strokeStyle='#303741';ctx.beginPath();ctx.moveTo(0,H-20);ctx.lineTo(W,H-20);ctx.stroke();vals.forEach((v,i)=>{let h=v/max*80;ctx.fillStyle='#ff7a45';ctx.fillRect(i*gap+gap*.25,H-20-h,gap*.5,h);ctx.fillStyle='#8f99a5';ctx.font='11px system-ui';ctx.fillText(String(v),i*gap+gap*.43,H-25-h)})}
render();addEventListener('resize',draw);</script></body></html>
