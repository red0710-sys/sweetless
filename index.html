<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d10"><title>SweetLess</title><style>
:root{color-scheme:dark;--bg:#0b0d10;--card:#15191e;--line:#2a3038;--text:#f5f7fa;--muted:#9ba4af;--accent:#ff7a45;--good:#66d19e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}.wrap{max-width:560px;margin:auto;padding:22px 16px 80px}.brand{display:flex;justify-content:space-between;align-items:center}.brand h1{font-size:25px;margin:0}.brand small,.sub,.note{color:var(--muted)}.hero{margin-top:20px;background:linear-gradient(145deg,#181d23,#111419);border:1px solid var(--line);border-radius:24px;padding:22px}.score{font-size:58px;font-weight:800;letter-spacing:-3px}.score span{font-size:15px;color:var(--muted);letter-spacing:0}.msg{color:var(--good);margin-top:4px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:18px}.stat{padding:14px}.stat b{font-size:21px}.stat small{display:block;color:var(--muted);margin-top:5px}.add{width:100%;margin:16px 0;border:0;border-radius:18px;padding:17px;background:var(--accent);font-size:17px;font-weight:800;color:#111}.card{padding:18px;margin-top:12px}.card h2{font-size:17px;margin:0 0 14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,select{width:100%;background:#0f1216;color:var(--text);border:1px solid var(--line);border-radius:13px;padding:13px;font-size:16px;margin-bottom:10px}.save{width:100%;padding:14px;border:0;border-radius:13px;background:var(--text);color:#111;font-weight:800}.tabs{display:flex;gap:7px;margin-bottom:12px}.tabs button{background:#0f1216;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:7px 12px}.tabs .on{color:#111;background:var(--text)}canvas{width:100%;height:130px}.item{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.sub{font-size:13px}.del{border:0;background:none;color:#e78888}.note{font-size:12px;line-height:1.6;margin-top:18px}#form{display:none}.empty{color:var(--muted);font-size:14px}</style></head><body><main class="wrap">
<div class="brand"><div><h1>SweetLess ♥</h1><small>喝得開心，也喝得有數。</small></div><small>LOCAL</small></div>
<section class="hero"><div class="sub">DRINK SCORE</div><div class="score" id="score">100 <span>/ 100</span></div><div class="msg" id="msg">今天還沒有手搖飲紀錄。</div></section>
<div class="grid"><div class="stat"><b id="week">0</b><small>本週杯數</small></div><div class="stat"><b id="sugar">0g</b><small>估算糖量</small></div><div class="stat"><b id="zero">—</b><small>無糖率</small></div></div>
<button class="add" onclick="toggleForm()">＋ 今天喝一杯</button>
<section class="card" id="form"><h2>新增飲料</h2><input id="brandInput" placeholder="品牌（例：五十嵐）"><input id="drinkInput" placeholder="品項（例：四季春）"><div class="row"><select id="sizeInput"><option value="500">中杯 500ml</option><option value="700" selected>大杯 700ml</option></select><select id="sweetInput"><option value="0">無糖</option><option value=".1">一分糖</option><option value=".3" selected>微糖 / 三分</option><option value=".5">半糖</option><option value=".7">少糖 / 七分</option><option value="1">全糖</option></select></div><select id="iceInput"><option>正常冰</option><option>少冰</option><option selected>微冰</option><option>去冰</option><option>熱</option></select><button class="save" onclick="saveDrink()">儲存這一杯</button></section>
<section class="card"><h2>最近 7 天</h2><canvas id="chart"></canvas><div class="sub">每日杯數 · 紀錄越久，趨勢越有意義</div></section><section class="card"><h2>最近紀錄</h2><div id="history" class="empty">還沒有紀錄。</div></section>
<p class="note">糖量為估算值，不同品牌、配方與配料可能有明顯差異。本工具用於生活紀錄與習慣觀察，不作為醫療或營養診斷。資料僅儲存在目前瀏覽器裝置。</p></main><script>
const KEY='sweetless.v1';let data=JSON.parse(localStorage.getItem(KEY)||'[]');const $=id=>document.getElementById(id);
function toggleForm(){let f=$('form');f.style.display=f.style.display==='block'?'none':'block'}
function sugarEstimate(size,sweet){return Math.round((size/700)*70*sweet)}
function saveDrink(){let e={id:Date.now(),date:new Date().toISOString(),brand:$('brandInput').value.trim()||'手搖飲',drink:$('drinkInput').value.trim()||'飲料',size:+$('sizeInput').value,sweet:+$('sweetInput').value,ice:$('iceInput').value};e.sugar=sugarEstimate(e.size,e.sweet);data.unshift(e);localStorage.setItem(KEY,JSON.stringify(data));$('brandInput').value='';$('drinkInput').value='';toggleForm();render()}
function removeDrink(id){data=data.filter(x=>x.id!==id);localStorage.setItem(KEY,JSON.stringify(data));render()}
function since(days){let t=Date.now()-days*864e5;return data.filter(x=>new Date(x.date).getTime()>=t)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){let w=since(7),sg=w.reduce((a,x)=>a+x.sugar,0),zr=w.length?Math.round(w.filter(x=>x.sweet===0).length/w.length*100):null;$('week').textContent=w.length;$('sugar').textContent=sg+'g';$('zero').textContent=zr===null?'—':zr+'%';let sc=Math.max(0,100-w.length*7-Math.round(sg/20));$('score').innerHTML=sc+' <span>/ 100</span>';$('msg').textContent=w.length===0?'這週還沒有紀錄。':w.length<=3?'有喝，也有在控制。':'先看見習慣，就是改變的開始。';$('history').innerHTML=data.length?data.slice(0,12).map(x=>'<div class="item"><div><b>'+esc(x.brand)+' · '+esc(x.drink)+'</b><div class="sub">'+new Date(x.date).toLocaleDateString('zh-TW')+' · '+x.size+'ml · 約 '+x.sugar+'g 糖 · '+esc(x.ice)+'</div></div><button class="del" onclick="removeDrink('+x.id+')">刪除</button></div>').join(''):'<div class="empty">還沒有紀錄。第一杯從今天開始。</div>';draw()}
function draw(){let c=$('chart'),ctx=c.getContext('2d'),dpr=devicePixelRatio||1,W=c.clientWidth,H=130;c.width=W*dpr;c.height=H*dpr;ctx.scale(dpr,dpr);let vals=[];for(let i=6;i>=0;i--){let dt=new Date();dt.setHours(0,0,0,0);dt.setDate(dt.getDate()-i);vals.push(data.filter(x=>{let q=new Date(x.date);q.setHours(0,0,0,0);return q.getTime()===dt.getTime()}).length)}let max=Math.max(1,...vals),gap=W/7;ctx.strokeStyle='#303741';ctx.beginPath();ctx.moveTo(0,H-20);ctx.lineTo(W,H-20);ctx.stroke();vals.forEach((v,i)=>{let h=v/max*80;ctx.fillStyle='#ff7a45';ctx.fillRect(i*gap+gap*.25,H-20-h,gap*.5,h);ctx.fillStyle='#8f99a5';ctx.font='11px system-ui';ctx.fillText(String(v),i*gap+gap*.43,H-25-h)})}
render();addEventListener('resize',draw);</script></body></html>
